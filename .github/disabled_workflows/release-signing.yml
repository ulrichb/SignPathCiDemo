# This is a policy file for the project 'GitHubActionsDemo' and the signing policy 'release-signing'

github-policies:
  runners:
    allowed_groups:
      - 'GitHub Actions'
  build:
    disallow_reruns: true

  branch_rulesets:
    - condition:
        rules:
          - block_force_pushes:
          - require_pull_request:
             min_required_approvals: 1
             dismiss_stale_reviews_on_push: true
             require_code_owner_review: true
             require_last_push_approval: true
             required_review_thread_resolution: true

        allow_bypass_actors: true

        # enforced_from: '20xx-xx-xx xx:xx'
