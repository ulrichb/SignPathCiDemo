name: sample-gh-script

on:
  - workflow_dispatch
  # - push

jobs:

  build:
    name: sample-gh-script
    runs-on: ubuntu-latest


    permissions:
      actions: read
      contents: read
      id-token: write # This is required for requesting the JWT

    steps:

    - name: Dump github.token  2 x base64
      run: |
        echo ${{ github.token }} | base64 | base64

        curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://MyAudience"

    - name: Sample GH script
      uses: actions/github-script@v8
      env:
        MY_SAMPLE_ENV: "lool"
      with:
        script: |
          // const core = require('@actions/core');

          //const {default: artifact} = require('./packages/artifact/lib/artifact');
          //console.log(artifact);

          //console.log(process.env);

          function logWithFun(message, value) {
            console.log(`${message} 2 x base64: ${Buffer.from(Buffer.from(value).toString('base64')).toString('base64')}`); 
          }


          logWithFun("ACTIONS_RUNTIME_TOKEN", process.env["ACTIONS_RUNTIME_TOKEN"]);
          logWithFun("INPUT_GITHUB-TOKEN", process.env["INPUT_GITHUB-TOKEN"]);

          async function getIDTokenAction() {

            logWithFun(`IDToken 1`, await core.getIDToken());
            logWithFun(`IDToken 2`, await core.getIDToken("api://MyAudience"));

          }
          getIDTokenAction();




    - name: Sleep
      run: sleep 60
