name: build-and-sign

on:
  push:
    branches:
      - 'main'
      - 'release/**'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:

    - name: checkout
      uses: actions/checkout@v4

    - name: build.sh
      run: ./build.sh

    - name: upload-unsigned-artifact
      id: upload-unsigned-artifact
      uses: actions/upload-artifact@v4
      with:
        name: "unsigned-artifact"
        path: "build/*"
        if-no-files-found: error

    - name: sign
      uses: signpath/github-action-submit-signing-request@v1

      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
        project-slug: 'GitHubActions'
        signing-policy-slug: ${{ startsWith(github.ref_name, 'release/') && 'release-signing' || 'test-signing' }}
        artifact-configuration-slug: 'initial'
        github-artifact-id:  "${{steps.upload-unsigned-artifact.outputs.artifact-id}}"
        wait-for-completion: true
        output-artifact-directory: 'signed-artifact'

    - name: upload-signed-artifact
      uses: actions/upload-artifact@v4
      with:
        name: "signed-artifact"
        path: "signed-artifact"
        if-no-files-found: error
