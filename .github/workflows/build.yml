name: build

on:
  - workflow_dispatch
  - push

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Run build.sh
        env:
          GH_BEARER_TOKEN: ${{ secrets.GH_BEARER_TOKEN }}
        run: ./build.sh "${{ github.sha }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Packages
          path: |
            artifact.txt
