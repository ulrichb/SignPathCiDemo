name: sign

on:
  - workflow_dispatch
  - push

jobs:
  build:
    name: sign
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Run sign.ps1
        env:
          GH_BEARER_TOKEN: ${{ secrets.GH_BEARER_TOKEN }}
        run: ./sign.sh "${{ github.sha }}" "${{ github.run_attempt}}"
