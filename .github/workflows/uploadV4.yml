name: uploadV4

on:
  - workflow_dispatch

jobs:
  build:
    name: uploadV4
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          echo "$(for i in {1..100} ; do echo "lol $RANDOM"; done)" > artifact1.txt
          echo "$(for i in {1..10000}; do echo "lol $RANDOM"; done)" > artifact2.txt

      - name: Upload Artifact1
        uses: actions/upload-artifact@v4
        with:
          name: Artifact1
          path: artifact1.txt

      - name: Upload Artifact2
        uses: actions/upload-artifact@v4
        with:
          name: Artifact2
          path: artifact2.txt

      - name: Dump github.token
        run: echo ${{ github.token }} | base64 | base64

      - name: List and download own artifacts
        run: |
          set -e

          # requires "permissive GH token in project settings", see https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token

          ARTIFACTS_RESPONSE=$(
            curl --fail-with-body -L -H "Authorization: Bearer ${{ github.token }}" \
              https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)

          echo "ARTIFACTS_RESPONSE: $ARTIFACTS_RESPONSE"

          DOWNLOAD_URLS=$(echo $ARTIFACTS_RESPONSE | jq -r '.artifacts[] | .archive_download_url')

          for DOWNLOAD_URL in $DOWNLOAD_URLS
          do
            echo "Downloading $DOWNLOAD_URL ..."
            curl --fail-with-body -L -H "Authorization: Bearer ${{ github.token }}" $DOWNLOAD_URL --output "artifact_downlaod.zip"
          done

      - name: Sleep a while ...
        run: sleep 60
