name: uploadV4

on:
  - workflow_dispatch
  # - push

jobs:
  build:
    name: uploadV4
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Build
        run: |
          "lool" > artifact.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: |
            artifact.txt


      - name: Sleep
        run: |
          sleep 20

