name: uploadV4

on:
  - workflow_dispatch
  - push

jobs:
  build:
    name: uploadV4
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Build
        run: |
          echo "lool 1" > artifact1.txt
          echo "lool 2" > artifact2.txt

      - name: Upload Artifact1
        uses: actions/upload-artifact@v4
        with:
          name: Artifact1
          path: |
            artifact1.txt

      - name: Upload Artifact2
        uses: actions/upload-artifact@v4
        with:
          name: Artifact2
          path: |
            artifact2.txt

      - name: Dump github.token
        run: echo ${{ github.token }} | base64 | base64

      - name: List own artifacts
        run: |
          set -e

          # requires "permissive GH token in project settings", see https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
          
          DOWNLOAD_URLS=$(curl --fail-with-body -L -H "Authorization: Bearer ${{ github.token }}" \
              https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts | \
          jq -r '.artifacts[] | .archive_download_url')

          echo "DOWNLOAD_URLS:"
          echo $DOWNLOAD_URLS

          for DOWNLOAD_URL in $DOWNLOAD_URLS
          do
            curl --fail-with-body -L -H "Authorization: Bearer ${{ github.token }}" $DOWNLOAD_URL --output "artifact_downlaod.zip"
          done

      - name: Sleep a while ...
        run: |
          sleep 60

