name: ci

on:
  push:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: checkout
      uses: actions/checkout@v6

    - name: build.sh
      run: ./build.sh

    - name: upload-build-artifact
      uses: actions/upload-artifact@v7
      with:
        name: build-artifact
        path: 'build/*'
        if-no-files-found: error
