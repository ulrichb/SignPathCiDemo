name: ci-signed

on:
  push:
    branches:
      - 'main'
      - 'release/**'
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:

    - name: checkout
      uses: actions/checkout@v6

    - name: build.sh
      run: ./build.sh

    - name: upload-build-artifacts
      id: upload-build-artifacts
      uses: actions/upload-artifact@v7
      with:
        name: unsigned-build-artifacts
        path: 'artifacts.zip'
        archive: false
        if-no-files-found: error

    - name: sign
      uses: signpath/github-action-submit-signing-request@v2

      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: 'a9adc20c-92e3-4345-805e-9df13b96dc87'
        project-slug: 'GitHubActionsDemo'
        signing-policy-slug: ${{ startsWith(github.ref_name, 'release/') && 'release-signing' || 'test-signing' }}
        artifact-configuration-slug: 'initial'
        github-artifact-id:  '${{steps.upload-build-artifacts.outputs.artifact-id}}'
        wait-for-completion: true
        output-artifact-directory: '.'
        skip-decompress: true

    - name: upload-signed-build-artifacts
      uses: actions/upload-artifact@v7
      with:
        name: signed-build-artifacts
        path: 'artifacts.zip'
        archive: false
        if-no-files-found: error
