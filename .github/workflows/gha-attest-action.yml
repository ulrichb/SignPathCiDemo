name: gha-attest-action

on:
  workflow_dispatch:

jobs:
  gha-attest-action:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          echo "hello world" > artifact.txt
      - name: Attest
        uses: actions/attest@v1
        with:
          subject-path: 'artifact.txt'
          predicate-type: 'https://example.com/predicate/v1'
          predicate: '{}'
