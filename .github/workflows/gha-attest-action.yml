name: build-attest

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Attest
        uses: actions/attest@v1
        with:
          subject-path: '${{ github.workspace }}/artifact.txt'
          predicate-type: 'https://example.com/predicate/v1'
          predicate: '{}'
